{% extends 'swgfApp/base.html' %}

{% block titulo %}Senha Emitida{% endblock %}
{% block titulo_pagina %}Senha Emitida{% endblock %}

{% block conteudo %}
<div class="card" style="max-width: 400px; margin: 0 auto; text-align: center;">
    <h2>Senha</h2>
    <div style="font-size: 64px; font-weight: bold; color: #2c2cdc; margin: 20px 0;">
        {{ ticket.senha.codigo }}
    </div>
    <div style="color: #666;">Horário: {{ ticket.hora_emissao|date:"H:i" }}</div>

    <a href="{% url 'swgfApp:totem' %}" class="btn btn-primario" style="margin-top: 25px;">Nova senha</a>
</div>
{% endblock %}
