{% extends 'swgfApp/base.html' %}

{% block titulo %}Totem — SWGF{% endblock %}
{% block titulo_pagina %}Retirar Senha{% endblock %}

{% block conteudo %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <form method="post">
        {% csrf_token %}
        <label for="{{ form.nome.id_for_label }}">{{ form.nome.label }}</label>
        {{ form.nome }}

        <label for="{{ form.tipo_prioridade.id_for_label }}">{{ form.tipo_prioridade.label }}</label>
        {{ form.tipo_prioridade }}

        <button type="submit" class="btn btn-primario" style="width: 100%; margin-top: 15px;">IMPRIMIR</button>
    </form>
</div>
{% endblock %}
