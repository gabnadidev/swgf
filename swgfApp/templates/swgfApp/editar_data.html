{% extends 'swgfApp/base.html' %}

{% block titulo %}Editar Data — SWGF{% endblock %}
{% block titulo_pagina %}Editar Data{% endblock %}

{% block conteudo %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <form method="post">
        {% csrf_token %}

        <label for="dia">Dia:</label>
        <input type="date" name="dia" id="dia" value="{{ registro.dia|date:'Y-m-d' }}" required>

        <label for="feriado">Nome do Feriado (opcional):</label>
        <input type="text" name="feriado" id="feriado" value="{{ registro.feriado|default:'' }}">

        <label for="status">Status:</label>
        <select name="status" id="status">
            <option value="ativo" {% if registro.status == 'ativo' %}selected{% endif %}>Ativo</option>
            <option value="inativo" {% if registro.status == 'inativo' %}selected{% endif %}>Inativo</option>
        </select>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-primario">Salvar</button>
            <a href="{% url 'swgfApp:datas' %}" class="btn btn-secundario">Cancelar</a>
            <a href="{% url 'swgfApp:deletar_data' registro.id %}" class="btn btn-perigo"
                onclick="return confirm('Deletar esta data?');">Deletar</a>
        </div>
    </form>
</div>
{% endblock %}
