{% extends 'swgfApp/base.html' %}
{# Tela de login, usada pela LoginUsuarioView. #}

{% block titulo %}Login — SWGF{% endblock %}
{% block titulo_pagina %}Login Workspace{% endblock %}

{% block conteudo %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    {% if form.errors %}
    <div class="erro-form" style="margin: 0 0 15px 0;">Usuário ou senha inválidos.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="id_username">Usuário:</label>
        <input type="text" name="username" id="id_username" autofocus required>

        <label for="id_password">Senha:</label>
        <input type="password" name="password" id="id_password" required>

        <button type="submit" class="btn btn-primario" style="width: 100%;">ENTRAR</button>
    </form>
</div>
{% endblock %}
